<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="pulse-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />

  <!-- Grid overlay -->
  <g stroke="rgba(59, 130, 246, 0.1)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Geofence Circles -->
  <circle cx="400" cy="230" r="160" fill="url(#pulse-grad)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 6" opacity="0.8" />
  <circle cx="400" cy="230" r="100" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <circle cx="400" cy="230" r="40" fill="none" stroke="#60a5fa" stroke-width="1.5" />

  <!-- Hospital Pin Marker -->
  <g transform="translate(400, 230)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="url(#accent-grad)" />
    <!-- Hospital Cross -->
    <path d="M-8,-3 H-3 V-8 H3 V-3 H8 V3 H3 V8 H-3 V3 H-8 Z" fill="#ffffff" />
  </g>

  <!-- Biometric Scanner Icon (Top Left floating card) -->
  <g transform="translate(120, 120)">
    <rect width="180" height="90" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" />
    <!-- Fingerprint Icon -->
    <path d="M40 35 C40 25 50 25 50 35 C50 45 40 45 40 35 Z M35 35 C35 20 55 20 55 35 C55 50 35 50 35 35" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <text x="75" y="42" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Biometric Verified</text>
    <text x="75" y="60" fill="#4ade80" font-family="sans-serif" font-size="12">✓ Face / Scan Match</text>
  </g>

  <!-- Geofence Status Badge (Top Right floating card) -->
  <g transform="translate(500, 120)">
    <rect width="180" height="90" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
    <circle cx="35" cy="45" r="12" fill="#22c55e" opacity="0.2"/>
    <circle cx="35" cy="45" r="6" fill="#22c55e" />
    <text x="60" y="42" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Geofence Active</text>
    <text x="60" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">Inside Hospital Zone</text>
  </g>

  <!-- Bottom Title Banner -->
  <rect x="150" y="390" width="500" height="60" rx="30" fill="rgba(15, 23, 42, 0.9)" stroke="url(#accent-grad)" stroke-width="2" filter="url(#glow)" />
  <text x="400" y="426" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1">GEOFENCE BIOMETRIC ATTENDANCE</text>
</svg>
